years: [2027, 2028, 2029]
cases: [Conservative, Base, Optimistic]
description: >
  Проектные сценарии для конкурсного кейса. Параметры не являются данными БСПБ.
  Верхняя часть воронки задаётся планом охвата, поскольку размер пригодной базы не раскрыт.
drivers:
  - id: targeted
    name: "Компании в охвате программы"
    unit: "комп."
    reason: "Проектная мощность канала. Клиентов БСПБ и долю ВЭД предстоит измерить отдельно."
    values: [[200, 350, 500], [400, 700, 1000], [500, 1000, 1700]]
  - id: fx_share
    name: "Доля с потенциальной FX-экспозицией"
    unit: "%"
    reason: "Диапазон для теста гипотезы по целевому охвату. Проверить в CRM и интервью."
    values: [[0.40, 0.43, 0.45], [0.55, 0.57, 0.60], [0.65, 0.68, 0.70]]
  - id: eligible
    name: "Подходят по сроку, валюте и доступу"
